name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  php:
    name: Lint and test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 8.2 is VIP's floor; 8.3 catches the deprecations that arrive next.
        php: [ '8.2', '8.3' ]

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          # xargs, not find -exec: find exits 0 even when the command it ran failed,
          # so -exec php -l would report a syntax error as a green build. xargs
          # propagates the failure.
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Validate the bundled sequence
        # Block scalar, because an unquoted ': ' anywhere in a run: value is a YAML
        # mapping and the whole workflow file stops parsing.
        run: |
          php -r '
            $config = json_decode(file_get_contents("workflow-discovery-cycling/sequences/cycling-desk.json"), true);
            if (!is_array($config) || empty($config["config"]["statuses"])) {
              fwrite(STDERR, "cycling-desk.json is not a readable sequence\n");
              exit(1);
            }
            $ideation = array_filter($config["config"]["metadata_fields"], fn($f) => !empty($f["show_in_ideation"]));
            printf("%d stages, %d metadata fields, %d asked at ideation\n",
              count($config["config"]["statuses"]),
              count($config["config"]["metadata_fields"]),
              count($ideation));
            // The show_in_ideation split is the point of this extension. A sequence
            // that flags nothing would install fine and demo nothing.
            exit(count($ideation) > 0 ? 0 : 1);
          '

      - name: Test the prompt mapper
        run: php workflow-discovery-cycling/tests/test-prompt-mapper.php

      - name: Test the rider extractor
        run: php workflow-assistant-rider-bios/tests/test-rider-extractor.php

      - name: Test the bio mapper
        run: php workflow-assistant-rider-bios/tests/test-bio-mapper.php
